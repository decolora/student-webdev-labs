<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>CSS Exercise 02 - Form</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="form-main">
      <!-- Start with the code from the HTML folder.
      - Make sure to fix any issues in your HTML code.
      - Delete all mentions of <br>s and style the line breaks with CSS. 
      - Add classes to style the elements on the page. -->
      <form method="post" action="/calculate" class="form-container">
        <h1>Roth IRA Calculator</h1>
        <div class="text-field">
          <label for="balance">Balance ($)</label>
          <input type="text" id="balance" name="balance" />
        </div>

        <div class="text-field">
          <label for="annual-contribution">Annual contribution ($)</label>
          <input
            type="text"
            id="annual-contribution"
            name="annual-contribution"
          />
        </div>

        <fieldset class="radio-field">
          <legend>Maximize contribution?</legend>
          <input type="radio" id="yes" name="max-option" value="yes" />
          <label for="yes">Yes</label>
          <input type="radio" id="no" name="max-option" value="no" />
          <label for="no">No</label>
        </fieldset>

        <div class="number-field">
          <label for="rate-of-return">Expected rate of return (%)</label>
          <input type="number" id="rate-of-return" name="rate-of-return" />
        </div>

        <div class="number-field">
          <label for="current-age">Current age</label>
          <input type="number" id="current-age" name="current-age" />
        </div>

        <div class="number-field">
          <label for="retirement-age">Retirement age</label>
          <input type="number" id="retirement-age" name="retirement-age" />
        </div>

        <div class="number-field">
          <label for="marginal-tax-rate">Marginal tax rate (%)</label>
          <input
            type="number"
            id="marginal-tax-rate"
            name="marginal-tax-rate"
          />
        </div>

        <div class="result-field">
          <input type="submit" value="Calculate" class="submit-btn" />
          <input type="reset" value="Reset" class="reset-btn" />
        </div>

        <p class="footnote">
          This exercise is a simplified version of the Roth IRA Calculator at
          <a href="https://calculator.net">Calculator.net</a>
        </p>
      </form>
    </main>
  </body>
</html>
